name: docker

on:
  push:
    branches: [main]
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "agents/**"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "pyproject.toml", "agents/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cairn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm cairn:ci --help
