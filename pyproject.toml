[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-agent"
version = "0.1.0"
description = "A self-evolving coding agent harness with tools, memory, skills, MCP, and sub-agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cairn = "agents.main:main"

[tool.setuptools]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
